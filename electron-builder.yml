appId: com.nyxevo.nyxlauncher
productName: NyxLauncher
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
publish:
  provider: github
  owner: LastWardMZ
  repo: nyxlauncher
  releaseType: release
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.utilities
linux:
  target:
    - AppImage
    - deb
  category: Game
